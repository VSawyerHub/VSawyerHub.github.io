<!DOCTYPE html>
<html lang="en">

{% include head.html %}

<body ontouchstart="" class="dungeon_container">

<nav class="navigation">
    <div class="nav_links">
        <a href="{{ site.baseurl }}/">/home</a>
        <a href="{{ site.baseurl }}/about">/about</a>
    </div>
</nav>

<header class="site-header">
    <div class="typewriter-container">
        <span class="typewriter-prefix">></span>
        <span class="typewriter-text" data-text="Digital Ghost in the Machine"></span>
        <span class="typewriter-cursor">|</span>
    </div>
</header>

{{ content }}

<script>
    function glitchText() {
        const texts = document.querySelectorAll('.glitch_text');
        texts.forEach(text => {
            setInterval(() => {
                text.style.transform = `translate(${Math.random() * 2 - 1}px, ${Math.random() * 2 - 1}px)`;
                setTimeout(() => {
                    text.style.transform = 'translate(0, 0)';
                }, 50);
            }, 3000);
        });
    }
    glitchText();

    function typewriterEffect() {
        const elements = document.querySelectorAll('.typewriter-text');
        elements.forEach(element => {
            const text = element.getAttribute('data-text');
            let index = 0;
            element.textContent = '';

            function type() {
                if (index < text.length) {
                    element.textContent += text.charAt(index);
                    index++;
                    setTimeout(type, Math.random() * 120 + 50);
                } else {
                    setTimeout(reset, 5000);
                }
            }

            function reset() {
                let currentText = element.textContent;
                let deleteInterval = setInterval(() => {
                    if (currentText.length > 0) {
                        currentText = currentText.slice(0, -1);
                        element.textContent = currentText;
                    } else {
                        clearInterval(deleteInterval);
                        index = 0;
                        setTimeout(type, 500);
                    }
                }, 30);
            }

            setTimeout(type, 1000);
        });
    }
    typewriterEffect();
</script>
</body>

</html>
