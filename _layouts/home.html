---
layout: default
---

<header class="site-header">
    <div class="header-content">
        <div class="header-left">
            <h2 class="portfolio-title">Victory Sawyer</h2>
            <h3 class="description">Bem vindo!</h3>
            <div class="skills-container">
                <span class="skills-prefix">></span>
                <span class="typewriter-text" data-texts='["Coding", "Gaming", "Design", "Fullstack", "Content Creator", "( ͡° ͜ʖ ͡°)"]'></span>
                <span class="typewriter-cursor">|</span>
            </div>
        </div>
        <div class="header-right">
            <div class="polaroid">
                <div class="polaroid-image"></div>
                <div class="polaroid-caption">˚₊‧ᓚᘏᗢ‧₊˚</div>
            </div>
        </div>
    </div>
</header>

<script>
    function multiTypewriterEffect() {
        const elements = document.querySelectorAll('.typewriter-text');
        elements.forEach(element => {
            const texts = JSON.parse(element.getAttribute('data-texts'));
            let textIndex = 0;
            let charIndex = 0;
            element.textContent = '';

            function type() {
                const currentText = texts[textIndex];
                if (charIndex < currentText.length) {
                    element.textContent += currentText.charAt(charIndex);
                    charIndex++;
                    setTimeout(type, Math.random() * 120 + 50);
                } else {
                    setTimeout(reset, 2000);
                }
            }

            function reset() {
                let currentText = element.textContent;
                let deleteInterval = setInterval(() => {
                    if (currentText.length > 0) {
                        currentText = currentText.slice(0, -1);
                        element.textContent = currentText;
                    } else {
                        clearInterval(deleteInterval);
                        textIndex = (textIndex + 1) % texts.length;
                        charIndex = 0;
                        setTimeout(type, 500);
                    }
                }, 30);
            }

            setTimeout(type, 1000);
        });
    }
    multiTypewriterEffect();
</script>
